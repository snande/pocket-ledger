<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Ledger</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main>
    <h1>Pocket Ledger</h1>
    <form id="quick-entry" autocomplete="off">
      <input type="text" name="entry" placeholder="120 chai" aria-label="New entry" aria-describedby="entry-error">
      <button type="submit">Add</button>
    </form>
    <p id="entry-error" role="alert"></p>
    <p>Today <span id="total-today">₹0.00</span></p>
    <p>This month <span id="total-month">₹0.00</span></p>
    <h2>Entries</h2>
    <ul id="today-list"></ul>
  </main>
</body>
</html>
