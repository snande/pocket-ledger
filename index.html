<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Ledger</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pocket Ledger">
  <!-- theme_color must match manifest.webmanifest's theme_color field -->
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1>Pocket Ledger</h1>
    <p id="privacy-notice">Entries are stored only on this device and are not shared with anyone who opens this link.</p>
    <form id="quick-entry" autocomplete="off">
      <input type="text" name="entry" placeholder="120 chai" aria-label="New entry" aria-describedby="entry-error">
      <button type="submit">Add</button>
    </form>
    <p id="entry-error" role="alert"></p>
    <p>Today <span id="total-today">₹0.00</span></p>
    <p>This month <span id="total-month">₹0.00</span></p>
    <h2>By category</h2>
    <ul id="category-breakdown" aria-live="polite"></ul>
    <h2>This month vs last month</h2>
    <div id="month-chart" aria-live="polite">No entries this month</div>
    <h2>Entries</h2>
    <ul id="today-list"></ul>
    <button type="button" id="backup-button">Backup</button>
    <label for="restore-input">Restore backup</label>
    <input type="file" id="restore-input" accept=".json,application/json">
    <p id="restore-status" role="status"></p>
  </main>
</body>
</html>
