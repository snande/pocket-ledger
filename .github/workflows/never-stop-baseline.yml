name: baseline-ci

# Seeded by never-stop when this repository was provisioned, so that
# every pull request has at least one check that REPORTS. A repo with
# zero registered workflows never reports a check at all, and an
# automated merge gate cannot tell that apart from CI that has not
# finished yet. Replace this with the project's own CI once it has
# one; nothing here depends on the file staying.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the project's tests when it has any
        shell: bash
        run: |
          set -eu

          has_npm_test=no
          if [ -f package.json ] && command -v node >/dev/null 2>&1; then
            if node -e "const s=(require('./package.json').scripts||{}).test||''; process.exit(s.trim() && !/no test specified/.test(s) ? 0 : 1)" >/dev/null 2>&1; then
              has_npm_test=yes
            fi
          fi

          test_files=$(find . -path ./node_modules -prune -o \( -name "test_*.py" -o -name "*_test.py" -o -name "*_test.go" -o -name "*.test.js" -o -name "*.test.ts" \) -type f -print) || true

          if [ "$has_npm_test" = yes ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
            npm test
          elif [ -n "$test_files" ]; then
            echo "Test files are present but this baseline workflow wires no"
            echo "runner for them. Replace it with real CI. Discovered:"
            echo "$test_files"
          else
            echo "No automated tests detected in this repository."
          fi
